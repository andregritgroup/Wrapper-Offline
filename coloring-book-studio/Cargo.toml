[package]
name = "coloring-book-studio"
version = "0.1.0"
edition = "2021"
description = "Turn a children's story and its characters into a printable, read-and-colour book using free AI image generation."
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
imageproc = { version = "0.25", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[profile.dev.package."*"]
# Image processing is unbearably slow unoptimised, even in debug builds.
opt-level = 3
